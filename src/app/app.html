@if (authService.isAuthenticated()) {
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo gradient-text">KMS Hub</span>
      </div>
      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <span>📁 Documents</span>
        </a>
        <a routerLink="/chat" routerLinkActive="active" class="nav-item">
          <span>💬 Global Q&A</span>
        </a>
        <a routerLink="/agents" routerLinkActive="active" class="nav-item">
          <span>🔑 Developer Keys</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-email">{{ authService.currentUser()?.email }}</span>
          <span class="user-role">Authorized Account</span>
        </div>
        <button class="btn btn-secondary" (click)="authService.logout()">Logout</button>
      </div>
    </aside>

    <div class="main-container">
      <header class="header">
        <span class="header-title">AI-Powered Knowledge Base</span>
        <div class="header-actions">
          <div class="status-indicator">
            <span class="status-dot" [class.connected]="wsService.connected()"></span>
            <span>{{ wsService.connected() ? 'Live Sync' : 'Offline' }}</span>
          </div>
          <button class="theme-toggle-btn" (click)="toggleTheme()" title="Toggle Theme">
            @if (authService.userPreferences().theme === 'dark') {
              ☀️
            } @else {
              🌙
            }
          </button>
        </div>
      </header>
      
      <main class="content-area">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
